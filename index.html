<style>
:root{
  --bg:#0b1f17; --card:#11291f; --line:#1e4433; --text:#e8f5ee; --muted:#8fb3a2;
  --accent:#2ecc71; --accent2:#1f8b4c; --warn:#e67e22; --danger:#e74c3c; --blue:#3498db;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;padding-bottom:70px}
body.red-mode{--bg:#1a0000;--card:#2a0a0a;--line:#4a1a1a;--text:#ffb3b3;--muted:#c77;--accent:#ff5555;--accent2:#cc3333}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);
  padding:12px 14px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:6px 10px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
nav button{flex:1;background:transparent;border:0;color:var(--muted);font-size:11px;padding:6px 0;
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{color:var(--accent)}
nav button span{font-size:18px}
main{padding:12px 14px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:10px;font-size:15px}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:block;width:100%;background:var(--accent2);color:#fff;border:0;border-radius:10px;
  padding:14px;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.small{padding:8px;font-size:13px;margin-top:8px}
.btn.warn{background:var(--warn)}.btn.danger{background:var(--danger)}
.chip{display:inline-block;background:var(--line);color:var(--text);border-radius:20px;
  padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
.list-item{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:10px}
.list-item .meta{font-size:12px;color:var(--muted);margin-top:4px}
.list-item .title{font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13px}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin:10px 0;padding:4px 0;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--accent)}
.stat small{color:var(--muted);font-size:11px}
canvas{max-width:100%}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
th{color:var(--muted);font-weight:500}
.point-item{display:flex;justify-content:space-between;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.point-item button{background:transparent;border:0;color:var(--danger);font-size:18px;padding:4px}
#map{height:300px;border-radius:12px;margin-bottom:12px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--accent2);
  color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:100;opacity:0;
  transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.mini{font-size:11px;color:var(--muted)}
.photo-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.photo-preview .thumb{position:relative;width:60px;height:60px}
.photo-preview img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.photo-preview .del{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;
  border:0;border-radius:50%;width:18px;height:18px;font-size:10px;line-height:1;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-content{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}

/* ▼ スマホ用修正（入力欄拡大・ボタン横並び） ▼ */
.list-item > div:last-child { display: flex; gap: 8px; margin-top: 8px; }
.list-item .btn.small { width: 50% !important; margin-top: 0 !important; display: block; }
 #fPointName { min-height: 48px !important; padding: 12px !important; font-size: 16px !important; }
</style>
</head>
<body>
<header>
  <h1>🎣 釣果ノート Pro</h1>
  <button id="redBtn" title="レッドライト">🌙</button>
  <button id="exportBtn" title="エクスポート">📤</button>
</header>

<main>
  <section id="tab-record" class="tab active">
    <div class="card">
      <h2>⚡ クイック記録</h2>
      <div class="row">
        <div><label>魚種</label><input id="qSpecies" list="speciesList" placeholder="例: シーバス"></div>
        <div style="flex:0 0 70px"><label>サイズ(cm)</label><input id="qSize" type="number" inputmode="decimal" placeholder="60"></div>
        <div style="flex:0 0 60px"><label>匹数</label><input id="qCount" type="number" inputmode="numeric" value="1"></div>
      </div>
      <datalist id="speciesList"></datalist>
      <button class="btn small ghost" id="quickAdd" style="margin-top:8px">＋ クイックでキャッチを追加</button>
    </div>

    <div class="card">
      <h2>📝 詳細記録</h2>
      <label>日付</label><input id="fDate" type="date">
      <div class="row">
        <div><label>開始</label><input id="fStart" type="time"></div>
        <div><label>終了</label><input id="fEnd" type="time"></div>
      </div>
      <label>釣法</label>
      <select id="fMethod">
        <option value="">選択してください</option>
        <option>ルアー</option><option>ウキ釣り</option><option>投げ釣り</option>
        <option>サビキ</option><option>フライ</option><option>テンカラ</option>
        <option>船釣り</option><option>氷穴釣り</option><option>その他</option>
      </select>

      <label>ポイント</label>
      <div class="row">
        <input id="fPointName" placeholder="釣り場名">
        <button class="btn small ghost" id="gpsBtn" style="flex:0 0 auto;margin-top:0">📍GPS</button>
      </div>
      <select id="fPointSel" style="margin-top:6px"><option value="">登録ポイントから選択</option></select>

      <label>タックルプリセット</label>
      <select id="fTackleSel"><option value="">プリセットなし</option></select>

      <details>
        <summary>タックル詳細を入力</summary>
        <label>ロッド（長さ/パワー/アクション）</label>
        <input id="fRod" placeholder="例: 9ft / M / ファスト">
        <label>リール（機種/ギア比/ドラグ）</label>
        <input id="fReel" placeholder="例: 4000XG / 6.2 / 10kg">
        <label>ライン（種類/号数/リーダー）</label>
        <div class="row">
          <select id="fLineType" style="flex:0 0 100px">
            <option value="">種類</option>
            <option>ナイロン</option>
            <option>フロロ</option>
            <option>PE</option>
            <option>エステル</option>
            <option>その他</option>
          </select>
          <input id="fLineDetail" placeholder="号数/リーダー (例: 1.0号 / 25lb)">
        </div>
        <label>仕掛け（針/オモリ/ウキ/エサ）</label>
        <input id="fRig" placeholder="例: 3号 / 5号 / なし / 青イソメ">
      </details>

      <label>天気・環境（自動取得＋修正可）</label>
      <div class="row">
        <select id="fWeather">
          <option value="">--</option>
          <option>☀️ 晴れ</option><option>☁️ 曇り</option><option>🌧️ 雨</option>
          <option>🌨️ 雪</option><option>🌫️ 霧</option>
        </select>
        <input id="fTemp" type="number" placeholder="気温℃">
      </div>
      <div class="row">
        <input id="fWindDir" placeholder="風向">
        <input id="fWindMs" type="number" placeholder="風速m/s">
      </div>
      <div class="row">
        <input id="fPressure" type="number" placeholder="気圧hPa">
        <input id="fWater" type="number" placeholder="水温℃">
      </div>
      <label>潮周り</label>
      <select id="fTide">
        <option value="">--</option>
        <option>大潮</option><option>中潮</option><option>小潮</option>
        <option>長潮</option><option>若潮</option>
      </select>
      <button class="btn small ghost" id="autoEnv">🌐 気象・潮汐を自動取得</button>

      <label>メモ</label>
      <textarea id="fMemo" placeholder="ヒットパターン・地形・気づきなど"></textarea>

      <label>写真（複数可）</label>
      <input id="fPhotos" type="file" accept="image/*" multiple>
      <div id="photoPreview" class="photo-preview"></div>

      <details>
        <summary>この釣行のキャッチ一覧（複数追加可）</summary>
        <div id="catchList" style="margin-bottom:10px"></div>
        <div class="row">
          <input id="cSpecies" list="speciesList" placeholder="魚種">
          <input id="cSize" type="number" placeholder="cm" style="flex:0 0 70px">
          <input id="cCount" type="number" value="1" placeholder="匹" style="flex:0 0 60px">
        </div>
        <div class="row" style="margin-top:6px">
          <input id="cHitTime" type="time" placeholder="ヒット時刻">
          <input id="cDepth" type="number" placeholder="水深m" style="flex:0 0 80px">
        </div>
        <input id="cLure" placeholder="ルアー/エサ（メーカー・色・重さ）" style="margin-top:6px">
        <button class="btn small" id="addCatch">＋ キャッチを追加</button>
      </details>
    </div>

    <div style="padding-bottom:20px">
      <button class="btn" id="saveSession">💾 釣行を保存する</button>
    </div>
  </section>

  <section id="tab-list" class="tab">
    <div class="card">
      <h2>🔎 フィルタ</h2>
      <div class="row">
        <select id="filterSpecies"><option value="">全魚種</option></select>
        <select id="filterMethod"><option value="">全釣法</option></select>
      </div>
      <div class="row">
        <select id="filterPoint"><option value="">全ポイント</option></select>
        <select id="filterTide"><option value="">全潮周り</option></select>
      </div>
      <div class="row">
        <input id="filterFrom" type="date">
        <input id="filterTo" type="date">
      </div>
    </div>
    <div id="sessionList"></div>
  </section>

  <section id="tab-stats" class="tab">
    <div class="card">
      <h2>📊 サマリ</h2>
      <div class="stat-grid">
        <div class="stat"><b id="stSessions">0</b><small>総釣行数</small></div>
        <div class="stat"><b id="stCatches">0</b><small>総釣果数</small></div>
        <div class="stat"><b id="stBest">0</b><small>自己ベスト(cm)</small></div>
        <div class="stat"><b id="stSpecies">0</b><small>魚種数</small></div>
      </div>
    </div>
    <div class="card">
      <h2>🏆 魚種別ランキング</h2>
      <div id="speciesRank" class="empty">記録がありません</div>
    </div>
    <div class="card">
      <h2>⏰ 時間帯別ヒット率</h2>
      <canvas id="hourChart" height="160"></canvas>
    </div>
    <div class="card">
      <h2>🌊 潮回り×魚種</h2>
      <div id="tideCross" class="mini"></div>
    </div>
    <div class="card">
      <h2>🌡️ 気圧・水温と釣果の相関</h2>
      <canvas id="corrChart" height="160"></canvas>
      <div id="corrText" class="mini"></div>
    </div>
    <div class="card">
      <h2>🎣 ルアー別釣果率</h2>
      <div id="lureRank" class="empty">記録がありません</div>
    </div>
    <div class="card">
      <h2>📍 ポイント別期待値</h2>
      <div id="pointExpect" class="empty">記録がありません</div>
    </div>
    <div class="card">
      <h2>📅 月別釣果推移</h2>
      <canvas id="monthChart" height="160"></canvas>
    </div>
    <div class="card">
      <button class="btn small ghost" id="exportCSV">📤 CSVエクスポート</button>
      <button class="btn small ghost" id="exportJSON">📤 JSONエクスポート</button>
    </div>
  </section>

  <section id="tab-points" class="tab">
    <div class="card">
      <h2>📍 ポイント管理</h2>
      <div id="map"></div>
      <div class="row">
        <input id="pName" placeholder="ポイント名">
        <button class="btn small" id="pAdd" style="flex:0 0 auto;margin-top:0">＋追加</button>
      </div>
      <div class="mini">現在地を使う場合は「📍GPS」→ 追加</div>
      <div id="pointList" style="margin-top:10px"></div>
    </div>
  </section>

  <section id="tab-settings" class="tab">
    <div class="card">
      <h2>🎣 タックルプリセット管理</h2>
      <div id="presetList"></div>
      <details style="margin-top:10px">
        <summary>＋ 新しいプリセットを追加</summary>
        <input id="presetName" placeholder="プリセット名 (例: シーバス用)" style="margin-top:6px">
        <input id="presetRod" placeholder="ロッド (例: 9ft M)" style="margin-top:6px">
        <input id="presetReel" placeholder="リール (例: 4000XG)" style="margin-top:6px">
        <div class="row" style="margin-top:6px">
          <select id="presetLineType" style="flex:0 0 100px">
            <option value="">種類</option>
            <option>ナイロン</option><option>フロロ</option><option>PE</option>
            <option>エステル</option><option>その他</option>
          </select>
          <input id="presetLineDetail" placeholder="号数/リーダー">
        </div>
        <input id="presetRig" placeholder="仕掛け (例: リーダー25lb)" style="margin-top:6px">
        <button class="btn small" id="presetAdd" style="margin-top:8px">＋ 追加する</button>
      </details>
    </div>
    <div class="card">
      <h2>🐟 魚種辞書</h2>
      <div class="row">
        <input id="fishAdd" placeholder="魚種名を追加">
        <button class="btn small" id="fishAddBtn" style="flex:0 0 auto;margin-top:0">＋</button>
      </div>
      <div id="fishList" class="mini" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2>🗂️ データ管理</h2>
      <button class="btn small ghost" id="migrateBtn">旧データを取り込む</button>
      <button class="btn small ghost" id="exportAll">全データエクスポート</button>
      <button class="btn small danger" id="clearAll">全データ削除</button>
    </div>
  </section>
</main>

<nav>
  <button data-tab="record" class="active"><span>📝</span>記録</button>
  <button data-tab="list"><span>📋</span>一覧</button>
  <button data-tab="stats"><span>📊</span>分析</button>
  <button data-tab="points"><span>📍</span>ポイント</button>
  <button data-tab="settings"><span>⚙️</span>設定</button>
</nav>

<div class="toast" id="toast"></div>

<script>  
const DB_NAME='fishing-log-pro', DB_VER=1;
let db;
function openDB(){return new Promise((res,rej)=>{
  const req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=e=>{
    const d=e.target.result;
    if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'});
    if(!d.objectStoreNames.contains('points'))d.createObjectStore('points',{keyPath:'id'});
    if(!d.objectStoreNames.contains('presets'))d.createObjectStore('presets',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});
    if(!d.objectStoreNames.contains('fish'))d.createObjectStore('fish',{keyPath:'name'});
  };
  req.onsuccess=e=>{db=e.target.result;res(db)};
  req.onerror=e=>rej(e);
})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function idbGetAll(store){return new Promise(res=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[])})}
function idbPut(store,val){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(val);r.onsuccess=()=>res();r.onerror=rej})}
function idbDel(store,key){return new Promise(res=>{const r=tx(store,'readwrite').delete(key);r.onsuccess=()=>res()})}
function idbGet(store,key){return new Promise(res=>{const r=tx(store).get(key);r.onsuccess=()=>res(r.result)})}
function idbClear(store){return new Promise(res=>{const r=tx(store,'readwrite').clear();r.onsuccess=()=>res()})}

let sessions=[], points=[], presets=[], fishDict=[];
let currentPhotos=[]; 
let currentCatches=[]; 
let currentLatLng=null;
let map, mapMarkers=[];

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayStr(){const d=new Date();return d.toISOString().slice(0,10)}
function nowTime(){const d=new Date();return d.toTimeString().slice(0,5)}

async function init(){
  await openDB();
  await loadAll();
  buildSpeciesDatalist();
  buildSelectOptions();
  bindTabs();
  bindRecord();
  bindList();
  bindStats();
  bindPoints();
  bindSettings();
  $('#fDate').value=todayStr();
  $('#fStart').value=nowTime();
  $('#fEnd').value=nowTime();
  initMap();
  renderAll();
}

async function loadAll(){
  sessions=await idbGetAll('sessions');
  points=await idbGetAll('points');
  presets=await idbGetAll('presets');
  fishDict=await idbGetAll('fish');
}

function bindTabs(){
  $$('nav button').forEach(b=>b.onclick=()=>{
    $$('nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    $$('.tab').forEach(t=>t.classList.remove('active'));
    $('#tab-'+b.dataset.tab).classList.add('active');
    if(b.dataset.tab==='stats')renderStats();
    if(b.dataset.tab==='points')renderPoints();
    if(b.dataset.tab==='settings')renderSettings();
    if(b.dataset.tab==='list')renderSessions();
    window.scrollTo(0,0);
  });
  $('#redBtn').onclick=()=>{document.body.classList.toggle('red-mode');toast('レッドライト切替')};
  $('#exportBtn').onclick=()=>{exportJSON();};
}

function bindRecord(){
  $('#quickAdd').onclick=()=>{
    const sp=$('#qSpecies').value.trim();
    if(!sp){toast('魚種を入力してください');return}
    const sz=parseFloat($('#qSize').value)||0;
    const ct=parseInt($('#qCount').value)||1;
    currentCatches.push({id:uid(),species:sp,sizeCm:sz,count:ct,hitTime:'',depthM:null,lure:'',photos:[]});
    $('#qSpecies').value='';$('#qSize').value='';$('#qCount').value='1';
    renderCatchList();
    toast('クイック追加しました');
  };

  $('#addCatch').onclick=()=>{
    const sp=$('#cSpecies').value.trim();
    if(!sp){toast('魚種を入力してください');return}
    currentCatches.push({
      id:uid(), species:sp, sizeCm:parseFloat($('#cSize').value)||0,
      count:parseInt($('#cCount').value)||1, hitTime:$('#cHitTime').value||'',
      depthM:parseFloat($('#cDepth').value)||null, lure:$('#cLure').value.trim(), photos:[]
    });
    $('#cSpecies').value='';$('#cSize').value='';$('#cCount').value='1';$('#cHitTime').value='';$('#cDepth').value='';$('#cLure').value='';
    renderCatchList(); toast('キャッチを追加しました');
  };

  $('#gpsBtn').onclick=()=>{
    if(!navigator.geolocation){toast('GPS非対応');return}
    navigator.geolocation.getCurrentPosition(async pos=>{
      currentLatLng={lat:pos.coords.latitude,lng:pos.coords.longitude};
      toast('現在地を取得しました');
      const near=points.find(p=>Math.abs(p.lat-currentLatLng.lat)<0.001&&Math.abs(p.lng-currentLatLng.lng)<0.001);
      if(near){$('#fPointName').value=near.name;$('#fPointSel').value=near.id}
    },err=>{toast('GPS取得失敗');console.warn(err)});
  };

  $('#autoEnv').onclick=async()=>{
    let lat=currentLatLng?.lat, lng=currentLatLng?.lng;
    if(!lat||!lng){
      if(!navigator.geolocation){toast('GPS非対応');return}
      try{
        const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000}));
        lat=pos.coords.latitude;lng=pos.coords.longitude;currentLatLng={lat,lng};
      }catch(e){toast('位置情報が必要です');return}
    }
    try{
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,weather_code&timezone=auto`;
      const r=await fetch(url);const j=await r.json();
      const c=j.current;
      $('#fTemp').value=c.temperature_2m?.toFixed(1)??'';
      $('#fPressure').value=c.surface_pressure?.toFixed(0)??'';
      $('#fWindMs').value=c.wind_speed_10m?.toFixed(1)??'';
      $('#fWindDir').value=windDirName(c.wind_direction_10m);
      $('#fWeather').value=weatherCodeToText(c.weather_code);
      const tideInfo=estimateTide(new Date(),lng);
      $('#fTide').value=tideInfo.type;
      toast('気象・潮汐を取得しました');
    }catch(e){toast('取得失敗（オフライン？）');console.warn(e)}
  };

  $('#fPhotos').onchange=async e=>{
    const files=[...e.target.files];
    for(const f of files){
      const data=await fileToDataURL(f);
      currentPhotos.push(data);
    }
    renderPhotoPreview();
    e.target.value='';
  };

  $('#saveSession').onclick=saveSession;

  $('#fPointSel').onchange=e=>{
    const p=points.find(x=>x.id===e.target.value);
    if(p){$('#fPointName').value=p.name;currentLatLng={lat:p.lat,lng:p.lng}}
  };
  $('#fTackleSel').onchange=e=>{
    const t=presets.find(x=>x.id===e.target.value);
    if(t){ 
      $('#fRod').value=t.rod||'';$('#fReel').value=t.reel||'';
      $('#fLineType').value=t.lineType||'';$('#fLineDetail').value=t.lineDetail||'';
      $('#fRig').value=t.rig||''; 
    }
  };
}

  const spMap={};
  allCatches.forEach(c=>{if(!c.species)return;spMap[c.species]=(spMap[c.species]||0)+(c.count||1)});

  allCatches.forEach(c=>{if(c.hitTime){const h=parseInt(c.hitTime.slice(0,2));if(!isNaN(h))hourCounts[h]+=(c.count||1)}});
  drawBar('hourChart',hourCounts.map((v,i)=>i+':00'),hourCounts);

  const tideCross={};
  sessions.forEach(s=>{const t=s.tide?.type||'未設定';tideCross[t]=tideCross[t]||{};(s.catches||[]).forEach(c=>{if(c.species)tideCross[t][c.species]=(tideCross[t][c.species]||0)+(c.count||1)})});
  $('#tideCross').innerHTML=Object.keys(tideCross).length?Object.entries(tideCross).map(([t,sp])=>{
    const top=Object.entries(sp).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`${esc(k)}:${v}`).join(', ');
    return `<div style="margin-bottom:6px"><b>${esc(t)}</b> → ${top}</div>`;
  }).join(''):'<div class="empty">記録がありません</div>';

  const pts=sessions.flatMap(s=>(s.catches||[]).map(c=>({x:s.weather?.pressureHpa,y:c.sizeCm}))).filter(p=>p.x&&p.y);
  const pts2=sessions.flatMap(s=>(s.catches||[]).map(c=>({x:s.weather?.waterTempC,y:c.count}))).filter(p=>p.x&&p.y);
  drawScatter('corrChart',pts.length?pts:pts2);
  const r=pts.length>2?pearson(pts.map(p=>p.x),pts.map(p=>p.y)):null;
  $('#corrText').textContent=pts.length>2?`気圧×サイズ相関 r=${r.toFixed(2)} (n=${pts.length})`:'データ不足';

  const lureMap={};
  allCatches.forEach(c=>{if(c.lure){lureMap[c.lure]=(lureMap[c.lure]||0)+(c.count||1)}});
  const lureRank=Object.entries(lureMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('#lureRank').innerHTML=lureRank.length?lureRank.map(([k,v],i)=>`<div class="point-item"><div>${i+1}. <b>${esc(k)}</b></div><div>${v}匹</div></div>`).join(''):'<div class="empty">記録がありません</div>';

  const ptMap={};
  sessions.forEach(s=>{const k=s.pointName||'未設定';ptMap[k]=ptMap[k]||{sessions:0,catches:0};(ptMap[k].sessions++);ptMap[k].catches+=(s.catches||[]).reduce((a,c)=>a+(c.count||1),0)});
  const ptRank=Object.entries(ptMap).sort((a,b)=>(b[1].catches/b[1].sessions)-(a[1].catches/a[1].sessions)).slice(0,10);
  $('#pointExpect').innerHTML=ptRank.length?ptRank.map(([k,v])=>`<div class="point-item"><div>📍<b>${esc(k)}</b></div><div>${(v.catches/v.sessions).toFixed(1)}匹/釣行 (${v.sessions}回)</div></div>`).join(''):'<div class="empty">記録がありません</div>';

  const monthMap={};
  sessions.forEach(s=>{const m=(s.date||'').slice(0,7);if(!m)return;monthMap[m]=(monthMap[m]||0)+(s.catches||[]).reduce((a,c)=>a+(c.count||1),0)});
  const months=Object.keys(monthMap).sort();
  drawBar('monthChart',months,months.map(m=>monthMap[m]));
}

function drawScatter(canvasId,pts){

function pearson(xs,ys){
  const n=xs.length;const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);dx+=(xs[i]-mx)**2;dy+=(ys[i]-my)**2}
  return num/Math.sqrt(dx*dy);
}

function windDirName(deg){
  if(deg==null)return'';
  const dirs=['北','北東','東','南東','南','南西','西','北西'];
  return dirs[Math.round(deg/45)%8];
}
function weatherCodeToText(code){
  if(code==null)return'';
  if(code===0)return'☀️ 晴れ';
  if([1,2,3].includes(code))return'☁️ 曇り';
  if([45,48].includes(code))return'🌫️ 霧';
  if([51,53,55,61,63,65,80,81,82].includes(code))return'🌧️ 雨';
  if([71,73,75,77,85,86].includes(code))return'🌨️ 雪';
  return'';
}
function estimateTide(date,lng){
  const synodic=29.530588853;
  const known=new Date('2000-01-06T18:14:00Z').getTime();
  const age=(((date.getTime()-known)/86400000)%synodic+synodic)%synodic;
  let type='中潮';
  if(age<1.8||age>synodic-1.8)type='大潮';
  else if(Math.abs(age-synodic/2)<1.8)type='大潮';
  else if(Math.abs(age-synodic/4)<2||Math.abs(age-3*synodic/4)<2)type='小潮';
  else if(Math.abs(age-synodic/2)<2.5)type='長潮';
  else type='中潮';
  return {type,age};
}

function exportJSON(){
  const data={schemaVersion:3,exportedAt:new Date().toISOString(),sessions,points,presets,fish:fishDict};
  download('fishing-log-pro-'+Date.now()+'.json',JSON.stringify(data,null,2),'application/json');
}
function exportCSV(){
  const rows=[['date','start','end','method','point','tide','weather','tempC','pressure','windDir','windMs','waterTempC','species','sizeCm','count','hitTime','depthM','lure','memo']];
  sessions.forEach(s=>{
    (s.catches||[]).forEach(c=>{
      rows.push([s.date,s.startTime,s.endTime,s.method,s.pointName,s.tide?.type,s.weather?.condition,
        s.weather?.tempC,s.weather?.pressureHpa,s.weather?.windDir,s.weather?.windMs,s.weather?.waterTempC,
        c.species,c.sizeCm,c.count,c.hitTime,c.depthM,c.lure,s.memo]);
    });
  });
  const csv=rows.map(r=>r.map(v=>{
    const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\n');
  download('fishing-log-'+Date.now()+'.csv',csv,'text/csv');
}
function download(name,content,type){
  const blob=new Blob([content],{type});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function migrateOldData(){
  const keys=Object.keys(localStorage).filter(k=>/fish|log|catch/i.test(k));
  let count=0;
  for(const k of keys){
    try{
      const v=JSON.parse(localStorage.getItem(k));
      const arr=Array.isArray(v)?v:(v.records||v.logs||[]);
      for(const r of arr){
        const session={
          id:uid(),schemaVersion:3,date:r.date||todayStr(),startTime:r.time||'',endTime:'',
          method:r.method||'',pointId:null,pointName:r.point||r.spot||'',lat:null,lng:null,
          tackle:{rod:r.rod||'',reel:r.reel||'',lineType:r.lineType||'',lineDetail:r.lineDetail||'',rig:r.rig||''},
          weather:{condition:r.weather||'',tempC:null,pressureHpa:null,windDir:r.windDir||'',windMs:null,waterTempC:r.waterTempC||null},
          tide:{type:r.tide||''},memo:r.memo||'',photos:[],catches:[],createdAt:Date.now(),updatedAt:Date.now()
        };
        if(r.species||r.size){
          session.catches.push({id:uid(),species:r.species||'',sizeCm:parseFloat(r.size)||0,count:parseInt(r.count)||1,hitTime:'',depthM:null,lure:'',photos:[]});
        }
        await idbPut('sessions',session);count++;
      }
    }catch(e){}
  }
  await loadAll();renderAll();
  toast(count?`${count}件取り込みました`:'旧データなし');
}

function renderAll(){
  renderSessions();renderStats();renderPoints();renderSettings();buildSelectOptions();buildSpeciesDatalist();
}
function fileToDataURL(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})}

init();
</script>
