<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>釣果ノート</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #fff8ee; --surface: #ffffff; --ink: #1a2b4a; --muted: #7a8aa8; --line: #ecdcc8;
      --accent: #ff6b35; --sea: #00a8c6; --sea-deep: #0066a1; --sea-soft: #e0f7fa;
      --grad-sunrise: linear-gradient(135deg, #ffb627 0%, #ff6b35 55%, #ff5d8f 100%);
      --grad-sea: linear-gradient(135deg, #00a8c6 0%, #0066a1 100%);
      --shadow-sm: 0 1px 2px rgba(26,43,74,.06); --shadow-md: 0 2px 8px rgba(26,43,74,.07), 0 10px 24px rgba(26,43,74,.06);
      --font-display: "M PLUS Rounded 1c", sans-serif; --font-body: "Zen Kaku Gothic New", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(1200px 420px at 50% -120px, rgba(255,182,39,.18), transparent 70%), radial-gradient(900px 500px at 50% 110%, rgba(0,168,198,.10), transparent 70%), var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .wrap { max-width: 600px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 18px; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; margin: 0; background: var(--grad-sunrise); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1::after { content: " 🎣"; -webkit-text-fill-color: initial; color: initial; font-size: 1.4rem; }
    
    .card { background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-md); display: grid; gap: 16px; }
    label { display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); font-weight: 700; }
    input, textarea, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; width: 100%; }
    input:focus { outline: none; border-color: var(--sea); box-shadow: 0 0 0 4px rgba(0,168,198,.15); }
    
    button { font: inherit; font-weight: 800; cursor: pointer; border-radius: 12px; padding: 12px 20px; border: 0; background: var(--grad-sunrise); color: #fff; box-shadow: 0 6px 20px rgba(255,107,53,.28); transition: transform .1s; }
    button:active { transform: scale(0.98); }
    
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .stat { background: var(--sea-soft); border-radius: 12px; padding: 12px; text-align: center; }
    .stat span { display: block; font-size: 0.75rem; color: var(--sea-deep); font-weight: 700; }
    .stat strong { font-size: 1.5rem; color: var(--sea-deep); }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>釣果ノート</h1>
  </header>

  <div class="card">
    <h2 style="margin:0; font-size:1.1rem; color:var(--sea-deep);">釣行を記録</h2>
    
    <label>日付
      <input type="date" id="input-date">
    </label>
    
    <label>釣り場名
      <input type="text" id="input-place" placeholder="例: 本牧海づり施設">
    </label>
    
    <label>釣れた魚
      <input type="text" id="input-fish" placeholder="例: アジ">
    </label>
    
    <label>サイズ（cm）
      <input type="number" id="input-size" placeholder="例: 25">
    </label>
    
    <button id="btn-save" type="button">記録を保存する</button>
  </div>

  <div class="card">
    <h2 style="margin:0; font-size:1.1rem; color:var(--sea-deep);">これまでの記録</h2>
    <div class="stat-grid">
      <div class="stat"><span>合計釣行</span><strong id="stat-trips">0</strong></div>
      <div class="stat"><span>合計匹数</span><strong id="stat-fish">0</strong></div>
    </div>
    <ul id="list" style="margin:0; padding:0; list-style:none; display:grid; gap:8px;">
      <li style="color:var(--muted); text-align:center; font-size:0.9rem;">まだ記録がありません</li>
    </ul>
  </div>
</div>

</body>
</html>
